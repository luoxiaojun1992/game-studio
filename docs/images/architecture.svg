  <!-- Arrow: Backend → Microservices -->
  <line x1="400" y1="505" x2="400" y2="530" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrowP)"/>
  <line x1="800" y1="505" x2="800" y2="530" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrowP)"/>

  <!-- ===== L3: 微服务层 ===== -->
