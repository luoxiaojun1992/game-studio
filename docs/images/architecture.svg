    <text x="960" y="95" text-anchor="middle" font-size="9" fill="#64748B">UI :16686</text>
    <text x="960" y="112" text-anchor="middle" font-size="9" fill="#64748B">OTLP :4317</text>
    <text x="960" y="128" text-anchor="middle" font-size="8" fill="#94A3B8">跨服务链路</text>

    <rect x="1045" y="25" width="110" height="110" rx="8" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="2" filter="url(#sh)"/>
    <text x="1100" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Draw.io</text>
