    <text x="895" y="164" font-size="9" fill="#065F46">• 安全路径解析</text>

    <text x="895" y="190" font-size="10" font-weight="700" fill="#047857">可观测性</text>
    <text x="895" y="208" font-size="9" fill="#065F46">• 日志流式采集</text>
    <text x="895" y="224" font-size="9" fill="#065F46">• SSE 事件广播</text>
    <text x="895" y="240" font-size="9" fill="#065F46">• OpenTelemetry 追踪</text>

    <rect x="895" y="255" width="240" height="38" rx="6" fill="#A7F3D0" stroke="#34D399" stroke-width="1"/>
