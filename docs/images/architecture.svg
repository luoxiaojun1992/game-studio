    <text x="1100" y="100" text-anchor="middle" font-size="9" fill="#64748B">:8083</text>
    <text x="1100" y="120" text-anchor="middle" font-size="8" fill="#94A3B8">jgraph/drawio</text>

    <!-- 架构关系说明 -->
    <rect x="400" y="150" width="755" height="115" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="420" y="175" font-size="11" font-weight="700" fill="#475569">架构关系</text>
