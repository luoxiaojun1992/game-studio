    <text x="155" y="78" text-anchor="middle" font-size="8" fill="#8B5CF6">建模 · 材质 · 场景 · 导出</text>
    <text x="155" y="92" text-anchor="middle" font-size="8" fill="#8B5CF6">安全路径防护</text>

    <rect x="305" y="25" width="260" height="80" rx="8" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2" filter="url(#sh)"/>
