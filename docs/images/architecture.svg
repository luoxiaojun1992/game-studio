    <text x="175" y="70" text-anchor="middle" font-size="10" fill="#A16207">better-sqlite3 驱动</text>
    <text x="175" y="90" text-anchor="middle" font-size="9" fill="#D97706">17 张表 · 项目级隔离</text>
    <text x="175" y="110" text-anchor="middle" font-size="9" fill="#D97706">data/studio.db</text>

    <rect x="25" y="145" width="300" height="55" rx="8" fill="#FEF9C3" stroke="#FDE68A" stroke-width="2" filter="url(#sh)"/>
    <text x="175" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">文件存储</text>
