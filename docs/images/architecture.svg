    <text x="472" y="95" text-anchor="middle" font-size="9" fill="#64748B">API :9000</text>
    <text x="472" y="112" text-anchor="middle" font-size="9" fill="#64748B">控制台 :9001</text>
    <text x="472" y="128" text-anchor="middle" font-size="8" fill="#94A3B8">game-files bucket</text>

    <rect x="565" y="25" width="145" height="110" rx="8" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="2" filter="url(#sh)"/>
    <text x="637" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">SonarQube</text>
    <text x="637" y="75" text-anchor="middle" font-size="10" fill="#475569">代码质量平台</text>
    <text x="637" y="95" text-anchor="middle" font-size="9" fill="#64748B">外部 :9002</text>
    <text x="637" y="112" text-anchor="middle" font-size="9" fill="#64748B">内部 :9000</text>
    <text x="637" y="128" text-anchor="middle" font-size="8" fill="#94A3B8">Token 24h TTL</text>

    <rect x="730" y="25" width="145" height="110" rx="8" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="2" filter="url(#sh)"/>
    <text x="802" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Star-Office</text>
    <text x="802" y="75" text-anchor="middle" font-size="10" fill="#475569">Agent 工作空间</text>
    <text x="802" y="95" text-anchor="middle" font-size="9" fill="#64748B">:19000 Flask</text>
    <text x="802" y="112" text-anchor="middle" font-size="9" fill="#64748B">join-keys.json</text>
    <text x="802" y="128" text-anchor="middle" font-size="8" fill="#94A3B8">每密钥 6 Agent</text>

    <rect x="895" y="25" width="130" height="110" rx="8" fill="#F1F5F9" stroke="#D1D5DB" stroke-width="2" filter="url(#sh)"/>
    <text x="960" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Jaeger</text>
