    <rect x="880" y="25" width="270" height="280" rx="8" fill="#D1FAE5" stroke="#34D399" stroke-width="2"/>
    <rect x="880" y="25" width="270" height="28" rx="8" fill="#059669"/>
    <text x="1015" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">基础设施</text>

    <text x="895" y="70" font-size="10" font-weight="700" fill="#047857">Studio 集成</text>
    <text x="895" y="88" font-size="9" fill="#065F46">• Star-Office 状态同步</text>
    <text x="895" y="104" font-size="9" fill="#065F46">• Agent 注册与健康检查</text>

