    <text x="715" y="78" text-anchor="middle" font-size="8" fill="#8B5CF6">图表 CRUD · 导出 PNG/SVG</text>
    <text x="715" y="92" text-anchor="middle" font-size="8" fill="#8B5CF6">→ 导出服务 :8083</text>

    <rect x="865" y="25" width="260" height="80" rx="8" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2" filter="url(#sh)"/>
    <rect x="865" y="25" width="260" height="26" rx="8" fill="#7C3AED"/>
    <text x="995" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">Scanner :8081</text>
    <text x="995" y="60" text-anchor="middle" font-size="9" fill="#6D28D9">SonarQube 扫描服务</text>
    <text x="995" y="78" text-anchor="middle" font-size="8" fill="#8B5CF6">ZIP 扫描 · 问题报告</text>
    <text x="995" y="92" text-anchor="middle" font-size="8" fill="#8B5CF6">Token 动态认证</text>
  </g>

  <!-- Arrow: Microservices → External -->
  <line x1="400" y1="660" x2="400" y2="685" stroke="#64748B" stroke-width="4" marker-end="url(#arrowO)"/>
  <line x1="995" y1="660" x2="600" y2="705" stroke="#64748B" stroke-width="4" marker-end="url(#arrowO)"/>

  <!-- ===== L4: 数据层 + 外部服务 ===== -->
  <g transform="translate(30, 695)">
    <!-- 数据层 -->
    <rect x="0" y="0" width="350" height="280" rx="10" fill="#FEFCE8" stroke="#FDE68A" stroke-width="2"/>
    <rect x="20" y="-10" width="70" height="22" rx="6" fill="#D97706"/>
