    <rect x="25" y="210" width="300" height="55" rx="8" fill="#FEF9C3" stroke="#FDE68A" stroke-width="2"/>
    <text x="175" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Docker Volumes（8 个）</text>
    <text x="175" y="255" text-anchor="middle" font-size="8" fill="#D97706">studio · output · minio · creator · drawio · scanner · image · sonarqube</text>

    <!-- 外部服务 -->
    <rect x="380" y="0" width="790" height="280" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="400" y="-10" width="90" height="22" rx="6" fill="#475569"/>
